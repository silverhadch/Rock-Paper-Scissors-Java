name: Build & Release

on:
  push:
    branches: [ "main" ]

jobs:
  # ── Build on each platform natively ─────────────────────────────────────────
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact: rock-paper-scissors-linux.jar
          - os: windows-latest
            label: windows
            artifact: rock-paper-scissors-windows.jar

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode package

      - name: Rename jar for platform
        shell: bash
        run: mv target/rock-paper-scissors.jar target/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-jar
          path: target/${{ matrix.artifact }}

  # ── Collect both jars and publish a single release ──────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Download Linux jar
        uses: actions/download-artifact@v4
        with:
          name: linux-jar
          path: dist/

      - name: Download Windows jar
        uses: actions/download-artifact@v4
        with:
          name: windows-jar
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "Build ${{ steps.sha.outputs.short }}"
          body: |
            Automated build from commit `${{ github.sha }}`

            > ${{ github.event.head_commit.message }}

            | File | Platform |
            |------|----------|
            | `rock-paper-scissors-linux.jar` | Linux (JDK 17 Temurin) |
            | `rock-paper-scissors-windows.jar` | Windows (JDK 17 Temurin) |

            **Run with:** `java -jar rock-paper-scissors-<platform>.jar`
          files: dist/*
          prerelease: true
